<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia 74</title>

    <link rel="stylesheet" href="../template.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1 class="title">
            <strong>Dia #74:</strong>
            <p>Pagination: Does anyone still use pagination at all or is everything now equipped with endless scroll?</p>
        </h1>
        <nav class="pagination-nav" id="pagination-nav">
            <input type="radio" name="nav" id="input1" checked>
            <input type="radio" name="nav" id="input2">
            <input type="radio" name="nav" id="input3">
            <input type="radio" name="nav" id="input4">

            <label for="input1" class="option1">1</label>
            <label for="input2" class="option2">2</label>
            <label for="input3" class="option3">3</label>
            <label for="input4" class="option4">4</label>
        </nav>
    </main>
</body>
</html>
